<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Repetition Counter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Audio Repetition Counter</h1>
    <div id="controls">
        <button id="set-phrase">Set Reference Phrase</button>
        <button id="start-counting">Start Counting</button>
        <button id="stop-counting" disabled>Stop Counting</button>
    </div>
    <div id="status">
        <p><strong>Status:</strong> <span id="status-message">Idle</span></p>
        <p><strong>Reference Phrase:</strong> <span id="reference-phrase">None</span></p>
        <p><strong>Target Count:</strong> <input type="number" id="target-count" value="10" min="1" max="999"></p>
        <p><strong>Similarity Threshold:</strong> <input type="number" id="similarity-threshold" value="0.7" min="0.1" max="0.9" step="0.1"></p>
        <p><strong>Count:</strong> <span id="current-count">0</span></p>
        <p><strong>Last attempt:</strong> <span id="last-attempt"></span></p>
    </div>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
